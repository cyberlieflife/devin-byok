server:
  host: "127.0.0.1"
  port: 8787
  public_base: "http://127.0.0.1:8787"

auth:
  fake_api_key: "devin-byok-local-key"
  fake_email: "byok@local"
  fake_name: "BYOK Local"

upstream:
  base_url: "https://api.example.com/v1"
  api_key: ""
  model: "grok-4.5"
  thinking:
    param: "reasoning_effort"
    default: "medium"
  families:
    - uid: "grok-4-5-byok"
      label: "Grok 4.5"
      context_window: 128000
      max_tokens: 8192
      provider: "openai"
      base_url: "https://api.example.com/v1"
      api_key: ""
      upstream_model: "grok-4.5"
    - uid: "claude-opus-4-6-byok"
      label: "Claude Opus 4.6"
      context_window: 200000
      max_tokens: 8192
      provider: "anthropic"
      base_url: "https://api.example.com"
      api_key: ""
      upstream_model: "claude-opus-4-6"
    - uid: "claude-opus-4-6-thinking-byok"
      label: "Claude Opus 4.6 Thinking"
      context_window: 200000
      max_tokens: 8192
      thinking_type: "enabled"
      thinking_budget_tokens: 4096
      provider: "anthropic"
      base_url: "https://api.example.com"
      api_key: ""
      upstream_model: "claude-opus-4-6-thinking"
  models:
    - id: "grok-4-5-byok-medium"
      label: "Grok 4.5 Medium"
      upstream_model: "grok-4.5"
      thinking: "medium"
      family: "Grok 4.5"
      family_uid: "grok-4-5-byok"
    - id: "claude-opus-4-6-byok-medium"
      label: "Claude Opus 4.6 Medium"
      upstream_model: "claude-opus-4-6"
      thinking: "medium"
      family: "Claude Opus 4.6"
      family_uid: "claude-opus-4-6-byok"
    - id: "claude-opus-4-6-thinking-byok-medium"
      label: "Claude Opus 4.6 Thinking Medium"
      upstream_model: "claude-opus-4-6-thinking"
      thinking: "medium"
      thinking_type: "enabled"
      thinking_budget_tokens: 4096
      family: "Claude Opus 4.6 Thinking"
      family_uid: "claude-opus-4-6-thinking-byok"
  timeout_sec: 120
  sampling:
    temperature: 0.7
    max_tokens: 8192

devin:
  # Windows: D:\\Devin       macOS: /Applications/Devin.app
  install_dir: ""
  portal_url_keys:
    - "devin.portalUrl"
    - "windsurf.portalUrl"

features:
  enable_chat: true
  enable_cascade_tools: true
  stub_unknown_rpc: true
  pure_local: true
  enable_stream: true
  enable_deepwiki: true
  enable_codemap: true
  deepwiki_model: claude-opus-4-6-byok-medium
  codemap_model: claude-opus-4-6-byok-medium
  codemap_fast_model: claude-opus-4-6-byok-medium
  codemap_smart_model: claude-opus-4-6-byok-medium
  command_model: claude-opus-4-6-byok-medium
  title_model: claude-opus-4-6-byok-medium
  fast_context_model: claude-opus-4-6-byok-medium

tools:
  mode: "standard"
  timeout_sec: 300
  workspace_hint: true

quality:
  enabled: true
  mode: balanced
  max_verification_rounds: 1
  reviewer_model: ""
  reviewer_effort: high

cache:
  # prompt=对齐 cursor-byok（推荐）；response=本地整段缓存；both=两者
  enabled: true
  mode: prompt
  ttl_sec: 180
  max_entries: 128
  # prompt_cache_key: ""   # 空则自动: devin-byok|<conv>|<upstream_model>
  include_cache_write_in_hit_rate: false
update:
  enabled: true
  repo: cyberlieflife/devin-byok
  # 留空时按当前平台自动匹配：windows-amd64.exe / darwin-arm64.dmg / darwin-x64.dmg
  asset_contains: ""
  auto_apply: false
