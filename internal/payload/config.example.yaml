server:
  host: "127.0.0.1"
  port: 8787
  public_base: "http://127.0.0.1:8787"

auth:
  fake_api_key: "devin-byok-local-key"
  fake_email: "byok@local"
  fake_name: "BYOK Local"

upstream:
  base_url: "https://api.openai.com/v1"
  api_key: "sk-xxx"
  model: "gpt-4.1-mini"
  thinking:
    param: "reasoning_effort"
    default: "medium"
  families:
    - uid: "gpt-4.1-mini-byok"
      label: "GPT-4.1 Mini BYOK"
      context_window: 128000
      max_tokens: 8192
  models:
    - id: "mini-low"
      label: "GPT-4.1 Mini BYOK Low"
      upstream_model: "gpt-4.1-mini"
      thinking: "low"
      family: "GPT-4.1 Mini BYOK"
      family_uid: "gpt-4.1-mini-byok"
    - id: "mini-medium"
      label: "GPT-4.1 Mini BYOK Medium"
      upstream_model: "gpt-4.1-mini"
      thinking: "medium"
      family: "GPT-4.1 Mini BYOK"
      family_uid: "gpt-4.1-mini-byok"
    - id: "mini-high"
      label: "GPT-4.1 Mini BYOK High"
      upstream_model: "gpt-4.1-mini"
      thinking: "high"
      family: "GPT-4.1 Mini BYOK"
      family_uid: "gpt-4.1-mini-byok"
  timeout_sec: 120
  sampling:
    temperature: 0.7
    max_tokens: 8192

devin:
  # Windows: D:\\Devin       macOS: /Applications/Devin.app/Contents/Resources/app
  install_dir: ""
  portal_url_keys:
    - "devin.portalUrl"
    - "windsurf.portalUrl"

features:
  enable_chat: true
  enable_cascade_tools: true
  stub_unknown_rpc: true
  pure_local: true
  enable_stream: true
  enable_deepwiki: true
  enable_codemap: true
  deepwiki_model: mini-medium
  codemap_model: mini-medium
  codemap_fast_model: mini-medium
  codemap_smart_model: mini-medium

tools:
  mode: "standard"
  timeout_sec: 300
  workspace_hint: true

cache:
  # prompt=对齐 cursor-byok（推荐）；response=本地整段缓存；both=两者
  enabled: true
  mode: prompt
  ttl_sec: 180
  max_entries: 128
  # prompt_cache_key: ""   # 空则自动: devin-byok|<conv>|<upstream_model>
  include_cache_write_in_hit_rate: false
update:
  enabled: true
  repo: cyberlieflife/devin-byok
  # 平台自动检测：windows-amd64.zip / darwin-arm64.zip / darwin-x64.zip
  asset_contains: ""
  auto_apply: false
