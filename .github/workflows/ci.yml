name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Vet
        run: go vet ./internal/... ./cmd/...

      - name: Build (non-GUI packages)
        run: go build ./internal/... ./cmd/devin-byok ./cmd/ls-wrapper ./cmd/prompt-eval

      - name: Test
        run: go test ./internal/... ./cmd/...

      - name: Build GUI (darwin)
        if: runner.os == 'macOS'
        run: go build ./cmd/devin-byok-gui

      - name: Build GUI (windows)
        if: runner.os == 'Windows'
        run: go build ./cmd/devin-byok-gui

      - name: Shell script syntax check
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/start-byok.sh scripts/stop-byok.sh scripts/start-local-api.sh scripts/uninstall-all.sh scripts/install-all.sh scripts/pack-release.sh