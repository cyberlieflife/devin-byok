name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      # GUI 依赖 systray（Linux 需要 ayatana-appindicator 系统库），
      # 且平台抽象层仅面向 Windows/macOS 官方产物。
      # Linux runner 只构建/测试非 GUI 包。
      - name: Vet (non-GUI)
        run: |
          go vet ./internal/...
          go vet ./cmd/devin-byok ./cmd/ls-wrapper ./cmd/prompt-eval

      - name: Vet GUI
        if: runner.os != 'Linux'
        run: go vet ./cmd/devin-byok-gui

      - name: Build (non-GUI packages)
        run: go build ./internal/... ./cmd/devin-byok ./cmd/ls-wrapper ./cmd/prompt-eval

      # 完整构建门禁：./... 覆盖所有包，能拦住仓库根目录误入的草稿包
      # （Linux 跳过：GUI 依赖 systray 系统库）
      - name: Build all packages
        if: runner.os != 'Linux'
        run: go build ./...

      - name: Test
        run: |
          go test ./internal/...
          go test ./cmd/devin-byok ./cmd/ls-wrapper ./cmd/prompt-eval

      # 前端 i18n 一致性门禁：字典对称、HTML/JS 引用覆盖、界面中文残留
      - name: i18n consistency check
        run: node scripts/check-i18n.mjs

      - name: Test race
        run: go test -race ./internal/...

      - name: go mod tidy check
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build GUI (darwin)
        if: runner.os == 'macOS'
        run: go build ./cmd/devin-byok-gui

      - name: Build GUI (windows)
        if: runner.os == 'Windows'
        run: go build ./cmd/devin-byok-gui

      # 交叉编译验证 Windows arm64 GUI 可构建（发布物由 release.yml 打包）
      - name: Build GUI (windows arm64 cross)
        if: runner.os == 'Windows'
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build ./cmd/devin-byok-gui

      - name: Shell script syntax check
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/start-byok.sh scripts/stop-byok.sh scripts/start-local-api.sh scripts/uninstall-all.sh scripts/install-all.sh scripts/pack-release.sh