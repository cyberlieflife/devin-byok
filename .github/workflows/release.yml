name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: package windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Package
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: ./scripts/pack-release.ps1 -Version $($env:GITHUB_REF_NAME -replace '^v','')

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}-release
          path: dist/devin-byok-*-windows-${{ matrix.arch }}.exe*
          if-no-files-found: error

  build-macos:
    name: package macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      # macos-13 已退役（无 runner）。macos-14 为 arm64 机器，
      # amd64 产物通过 GOARCH=amd64 + CGO_ENABLED=1 交叉编译生成。
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Package
        env:
          GOARCH: ${{ matrix.arch }}
        run: ./scripts/pack-release.sh ${GITHUB_REF_NAME#v}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: dist/devin-byok-*-darwin-${{ matrix.arch }}.dmg*
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # checkout 提供 git 上下文：gh release create --generate-notes 需要
      # 仓库历史生成变更说明，没有 .git 会直接失败。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME}
          VER=${TAG#v}
          ASSETS=()
          for f in dist-artifacts/devin-byok-*; do
            ASSETS+=("$f")
          done
          echo "Releasing ${TAG} with ${#ASSETS[@]} assets"
          # Release notes = CHANGELOG.md 当前版本条目（前置）+ GitHub 自动生成
          # 的 commit 变更列表（追加）。gh 会将 --notes 内容前置到自动生成
          # notes 之前；CHANGELOG 缺条目时仅用自动生成。
          BODY=$(awk -v tag="## [v${VER}]" 'index($0, tag)==1 {f=1} f && index($0, tag)!=1 && /^## \[v/ {exit} f' CHANGELOG.md)
          if [ -n "$BODY" ]; then
            gh release create "${TAG}" "${ASSETS[@]}" --title "${TAG}" --notes "$BODY" --generate-notes
          else
            # CHANGELOG 缺条目时回退到自动生成
            gh release create "${TAG}" "${ASSETS[@]}" --title "${TAG}" --generate-notes
          fi